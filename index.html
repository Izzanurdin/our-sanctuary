<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport with notch/safe-area support for iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Title & Descriptions -->
    <title>Our Sanctuary</title>
    <meta name="description" content="Private romantic sanctuary for Izza & Cahayu ❤️" />

    <!-- Standard Favicons (Pure Transparent, No Black Box) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="alternate icon" type="image/png" href="/favicon.png?v=2" />

    <!-- Apple iOS Safari PWA Configuration -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Our Sanctuary" />

    <!-- Web App Manifest (Android & Desktop PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-flicker background & loading pulse styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 0.95; transform: scale(1.08); }
      }
    </style>
  </head>
  <body>
    <!-- Pre-rendered Native Splash Screen: Instantly visible on iPhone & Android while scripts load -->
    <div id="root">
      <div style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;">
        <div style="position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(244,63,94,0.4) 0%,rgba(0,0,0,0) 70%);filter:blur(16px);animation:pulseGlow 2.4s ease-in-out infinite;"></div>
          <img src="/apple-touch-icon.png" alt="Our Sanctuary" width="96" height="96" style="position:relative;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.9),0 0 28px rgba(244,63,94,0.35);display:block;" />
        </div>
        <div style="color:#fce7f3;font-size:15px;letter-spacing:0.28em;text-transform:uppercase;margin-top:24px;font-weight:600;text-shadow:0 0 16px rgba(244,114,182,0.4);">Our Sanctuary</div>
        <div style="color:#f472b6;font-size:11px;margin-top:6px;letter-spacing:0.12em;opacity:0.85;">Izza &amp; Cahayu &#10084;&#65039;</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
