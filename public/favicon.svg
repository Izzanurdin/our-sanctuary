<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2d0b24" />
      <stop offset="55%" stop-color="#190615" />
      <stop offset="100%" stop-color="#0a0208" />
    </radialGradient>
    
    <!-- Heart Vibrant Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5996" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Romantic Ambient Filter Glow -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="125" stroke="#f43f5e" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Ambient Heart Glow -->
  <path d="M256 420s-144-88-144-190c0-52 42-94 95-94 31 0 58 15 73 40 15-25 42-40 73-40 53 0 95 42 95 94 0 102-144 190-144 190z" 
        fill="#f43f5e" opacity="0.4" filter="url(#ambientGlow)" />

  <!-- Main Romantic Heart -->
  <path d="M256 412s-138-84-138-184c0-48 39-88 90-88 29 0 56 14 71 38 15-24 42-38 71-38 51 0 90 40 90 88 0 100-138 184-138 184z" 
        fill="url(#heartGrad)" />

  <!-- Inner Soft Highlight -->
  <path d="M256 186c-11-20-32-32-56-32-39 0-70 31-70 70 0 58 72 121 126 155-19-39-29-68-29-97 0-44 14-73 29-96z" 
        fill="#ffffff" opacity="0.22" />

  <!-- Top Right Golden Sparkle Star -->
  <path d="M372 105 L379 122 L396 129 L379 136 L372 153 L365 136 L348 129 L365 122 Z" fill="url(#goldGlow)" />
  <!-- Small Center Sparkle -->
  <circle cx="372" cy="129" r="4" fill="#ffffff" />

  <!-- Bottom Left Soft Sparkle -->
  <path d="M128 326 L132 337 L143 341 L132 345 L128 356 L124 345 L113 341 L124 337 Z" fill="#ffd1dc" opacity="0.85" />

  <!-- Miniature Sparkle inside heart -->
  <path d="M272 210 L275 218 L283 221 L275 224 L272 232 L269 224 L261 221 L269 218 Z" fill="#ffffff" opacity="0.75" />
</svg>